# Copy this file to config/config.yaml and edit it.
# config/config.yaml is gitignored because it holds machine-specific settings
# (Bluetooth address, MQTT credentials, soundbar inputs).
#
# Keep this example free of real credentials and MAC addresses: it is the
# tracked schema that agents and humans use to discover config keys.
settings:
    # Placeholder flag used by the scaffold tests; safe to ignore.
    test: true

soundbar:
    # Bluetooth MAC address of the soundbar, e.g. "AA:BB:CC:DD:EE:FF".
    # Leave empty and pass --address to `ha-yas105 probe` if you prefer.
    bluetooth_address: ""
    # RFCOMM (SPP) channel. The protocol spec guesses 1; confirm it on the host with
    # `sdptool browse <MAC>` (look for "Serial Port" / 0x1101).
    rfcomm_channel: 1

